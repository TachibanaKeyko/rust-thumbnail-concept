<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Обложка Rust — пример</title>
<style>
body{margin:0;background:#0f0f0f;color:#f1f1f1;font-family:Roboto,Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:20px;font-weight:500;margin:0 0 16px}
.big{width:100%;border-radius:12px;display:block}
h2{font-size:16px;font-weight:500;color:#aaa;margin:32px 0 12px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;display:block}
.card .t{font-size:15px;font-weight:500;margin:10px 0 4px;line-height:1.3}
.card .m{font-size:13px;color:#aaa}
.small{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.small img{width:168px;border-radius:8px}
</style></head><body><div class="wrap">
<h1>Обложка по Rust — пример по вашему ТЗ</h1>
<img class="big" src="thumb.jpg" alt="обложка">
<h2>Как выглядит в ленте</h2>
<div class="feed">
<div class="card"><img src="thumb.jpg" alt=""><div class="t">Я ЗАБРАЛ СПУТНИК У ВСЕГО СЕРВЕРА | Rust</div><div class="m">ваш канал · 12 тыс. просмотров · 2 часа назад</div></div>
</div>
<h2>В рекомендациях справа</h2>
<div class="small"><img src="thumb.jpg" alt=""></div>
</div></body></html>
